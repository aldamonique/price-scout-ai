name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  SERPAPI_KEY: ci-unused
  OPENAI_API_KEY: ci-unused
  AGENT__MODEL: ci-unused
  AGENT__PROMPT_VERSION: v7
  JUDGE__MODEL: ci-unused
  JUDGE__PROMPT_VERSION: v2

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src tests scripts evals
      - run: uv run pytest -q
      - name: Check OpenAPI snapshot
        run: |
          uv run python scripts/export_openapi.py "$RUNNER_TEMP/openapi.json"
          diff --strip-trailing-cr "$RUNNER_TEMP/openapi.json" ../web/src/api/openapi.json

  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - name: Load fixtures
        working-directory: api
        run: |
          uv sync --frozen
          uv run python scripts/load_fixtures.py
      - name: dbt build
        working-directory: analytics
        run: |
          uv sync --frozen
          uv run dbt build --vars '{ci_fixtures: true}'

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check generated API types
        run: |
          npm run gen:api
          git diff --exit-code --ignore-cr-at-eol src/api/schema.d.ts
      - run: npm run lint
      - run: npm test
      - run: npm run build

  judge-accuracy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: api
    defaults:
      run:
        working-directory: api
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JUDGE__MODEL: ${{ vars.JUDGE__MODEL }}
      JUDGE__REASONING_EFFORT: ${{ vars.JUDGE__REASONING_EFFORT }}
      JUDGE__INPUT_USD_PER_MTOK: ${{ vars.JUDGE__INPUT_USD_PER_MTOK }}
      JUDGE__OUTPUT_USD_PER_MTOK: ${{ vars.JUDGE__OUTPUT_USD_PER_MTOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
      - run: uv sync --frozen
      - name: Judge accuracy
        run: uv run python -m evals.run --variant both --min-f1 0.8 --out eval-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: judge-accuracy
          path: api/eval-results
