[project]
name = "price-scout"
version = "0.1.0"
description = "Furniture shopping agent: plans, searches, compares and builds a plan."
readme = "README.md"
authors = [
    { name = "Alda Monique", email = "aldamonique2828@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.3",
    "duckdb>=2.0.0",
    "fastapi>=0.163.1",
    "httpx>=0.28.1",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.44.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "."]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
