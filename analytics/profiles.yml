price_scout:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DATA_DIR', '../data') }}/warehouse.duckdb"
      settings:
        file_search_path: "{{ env_var('DATA_DIR', '../data') }}"

    cloud:
      type: duckdb
      path: ../data/warehouse.duckdb
      extensions:
        - httpfs
      secrets:
        - type: s3
          key_id: "{{ env_var('LAKE__ACCESS_KEY_ID') }}"
          secret: "{{ env_var('LAKE__SECRET_ACCESS_KEY') }}"
          region: "{{ env_var('LAKE__REGION', 'us-east-1') }}"
          endpoint: "{{ env_var('LAKE__ENDPOINT', 'localhost:4566') }}"
          url_style: path
          use_ssl: "{{ env_var('LAKE__USE_SSL', 'false') }}"
